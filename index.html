<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Broker</title>
  <!-- Lightweight Charts CDN -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0e1118;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #161b22;
      border-bottom: 1px solid #2d3748;
    }

    .brand {
      font-weight: bold;
      font-size: 1.1rem;
      color: #00e676;
    }

    .balance {
      font-size: 0.9rem;
      color: #a0aec0;
    }

    .balance span {
      color: #00e676;
      font-weight: bold;
    }

    /* Fixed Height Chart Box */
    #chart-container {
      flex: 1;
      width: 100%;
      min-height: 350px;
      position: relative;
    }

    .controls {
      padding: 16px;
      background-color: #161b22;
      border-top: 1px solid #2d3748;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      min-width: 120px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.75rem;
      color: #a0aec0;
      text-transform: uppercase;
    }

    .input-group select,
    .input-group input {
      background-color: #0e1118;
      border: 1px solid #2d3748;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .buttons {
      display: flex;
      width: 100%;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-higher {
      background-color: #00e676;
      color: #000;
    }

    .btn-lower {
      background-color: #ff5252;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Pocket Broker</div>
    <div class="balance">Demo: <span id="balance-amount">$10,000.00</span></div>
  </header>

  <div id="chart-container"></div>

  <div class="controls">
    <div class="input-group">
      <label>Timer</label>
      <select id="timer-select">
        <option value="5">5 sec</option>
        <option value="10">10 sec</option>
        <option value="30">30 sec</option>
      </select>
    </div>

    <div class="input-group">
      <label>Amount ($)</label>
      <input type="number" id="trade-amount" value="50" min="1" />
    </div>

    <div class="buttons">
      <button class="btn btn-higher" onclick="placeTrade('HIGHER')">▲ HIGHER (+92%)</button>
      <button class="btn btn-lower" onclick="placeTrade('LOWER')">▼ LOWER (+92%)</button>
    </div>
  </div>

  <script>
    // Define interactive trade functions globally
    let balance = 10000.00;
    function placeTrade(direction) {
      const amountInput = document.getElementById('trade-amount');
      const amount = parseFloat(amountInput.value);
      if (isNaN(amount) || amount <= 0) {
        alert('Please enter a valid amount');
        return;
      }
      if (amount > balance) {
        alert('Insufficient funds!');
        return;
      }
      balance -= amount;
      document.getElementById('balance-amount').innerText = `$${balance.toFixed(2)}`;
    }
