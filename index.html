<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Octopus Trading</title>
    <!-- Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0e1118; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #161b26; border-bottom: 1px solid #232936; }
        .logo { font-weight: bold; font-size: 1.1rem; color: #00e676; }
        .balance-card { background: #232936; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; }
        .balance-amount { color: #00e676; font-weight: bold; }

        /* Chart Area */
        #chart-container { flex: 1; width: 100%; position: relative; }

        /* Bottom Controls Area */
        .controls { background: #161b26; padding: 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #232936; }
        .input-group { display: flex; gap: 10px; }
        .input-box { flex: 1; background: #232936; border: 1px solid #2a3142; border-radius: 8px; padding: 8px 12px; color: #fff; display: flex; flex-direction: column; }
        .input-box label { font-size: 0.7rem; color: #8a94a6; margin-bottom: 2px; }
        .input-box input, .input-box select { background: transparent; border: none; color: #fff; font-size: 1rem; outline: none; font-weight: bold; }

        .btn-group { display: flex; gap: 10px; }
        .trade-btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; color: #fff; cursor: pointer; transition: opacity 0.2s; }
        .trade-btn:active { opacity: 0.8; }
        .btn-up { background-color: #00e676; }
        .btn-down { background-color: #ff5252; }

        /* Status Toast */
        #status-toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(35, 41, 54, 0.95); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; border: 1px solid #2a3142; display: none; z-index: 10; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐙 OCTOPUS TRADING</div>
        <div class="balance-card">Demo: <span class="balance-amount" id="balance">$10,000.00</span></div>
    </header>

    <div id="chart-container"></div>
    <div id="status-toast"></div>

    <div class="controls">
        <div class="input-group">
            <div class="input-box">
                <label>TIMER</label>
                <select id="time-select">
                    <option value="5">5 sec</option>
                    <option value="10">10 sec</option>
                    <option value="30">30 sec</option>
                </select>
            </div>
            <div class="input-box">
                <label>AMOUNT ($)</label>
                <input type="number" id="stake-amount" value="50" min="1">
            </div>
        </div>

        <div class="btn-group">
            <button class="trade-btn btn-up" onclick="placeTrade('HIGHER')">▲ HIGHER (+92%)</button>
            <button class="trade-btn btn-down" onclick="placeTrade('LOWER')">▼ LOWER (+92%)</button>
        </div>
    </div>

    <script>
        // State Management
        let balance = 10000.00;
        let currentPrice = 100.00;
        let activeTrade = null;

        // Initialize Lightweight Chart
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            layout: { backgroundColor: '#0e1118', textColor: '#8a94a6' },
            grid: { vertLines: { color: '#161b26' }, horzLines: { color: '#161b26' } },
            timeScale: { timeVisible: tr
